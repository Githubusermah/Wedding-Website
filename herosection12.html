<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Save the Date — Farhad &amp; Sahar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Playfair+Display:wght@500;600&family=Tangerine:wght@700&family=Noto+Naskh+Arabic:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory: #faf5e8;
    --ivory-deep: #f1e8d4;
    --ink: #241d17;
    --ink-soft: #6b5f4f;
    --gold: #b8863f;
    --gold-light: #e9c96a;
    --gold-dark: #8a6329;
    --jade: #4a6b40;
    --oxblood: #7a1c28;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    background: radial-gradient(ellipse at 50% -10%, #fffdf6 0%, var(--ivory) 45%, var(--ivory-deep) 100%);
    font-family: 'Cormorant Garamond', serif;
    color: var(--ink);
    overflow-x:hidden;
  }

  #sky{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
  }

  .stage{
    position:relative;
    z-index:2;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 2.5vh 5vw;
  }

  .card{
    position:relative;
    width:min(560px, 92vw);
    text-align:center;
    padding: 1.6rem 1.5rem 1.2rem;
    opacity:0;
    animation: cardIn 1.4s ease-out 0.2s forwards;
  }

  @keyframes cardIn{
    from{ opacity:0; transform: translateY(18px) scale(0.98); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }

  /* corner frame for the whole page — one bracket per corner, fixed to viewport */
  .site-corner{
    position:fixed;
    width:56px; height:56px;
    border: 1.5px solid var(--gold);
    z-index:5;
    opacity:0;
    pointer-events:none;
    animation: siteCornerIn 1.2s ease-out 0.4s forwards;
  }
  .site-corner.sc-tl{ top:16px;    left:16px;  border-right:none; border-bottom:none; }
  .site-corner.sc-tr{ top:16px;    right:16px; border-left:none;  border-bottom:none; }
  .site-corner.sc-bl{ bottom:16px; left:16px;  border-right:none; border-top:none; }
  .site-corner.sc-br{ bottom:16px; right:16px; border-left:none;  border-top:none; }
  @keyframes siteCornerIn{ to{ opacity:0.85; } }

  /* petals / gold dust drifting */
  .petal{
    position:fixed;
    top:-5%;
    z-index:1;
    border-radius:50% 0 50% 50%;
    background: linear-gradient(135deg, var(--gold-light), var(--gold));
    opacity:0.55;
    pointer-events:none;
    animation-name: drift;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes drift{
    0%{ transform: translateY(-10vh) translateX(0) rotate(0deg); opacity:0; }
    8%{ opacity:0.6; }
    92%{ opacity:0.4; }
    100%{ transform: translateY(110vh) translateX(var(--drift-x, 40px)) rotate(340deg); opacity:0; }
  }

  /* ---- Headline block ---- */
  .eyebrow-wrap{
    overflow:hidden;
    white-space:nowrap;
    width: 0;
    margin: 0 auto 0.5rem;
    animation: typeReveal 1.1s steps(24,end) 0.6s forwards;
  }
  @keyframes typeReveal{ to{ width: 100%; } }

  .eyebrow{
    font-family:'Playfair Display', serif;
    font-size: clamp(0.65rem, 1.6vw, 0.8rem);
    letter-spacing: 0.32em;
    color: var(--gold-dark);
    font-weight:600;
    white-space:nowrap;
  }

  .headline{
    position:relative;
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap: 0.5rem;
    flex-wrap:wrap;
    margin-bottom: 0.1rem;
  }

  .word{
    display:inline-block;
    overflow:hidden;
  }

  .word span{
    display:inline-block;
    font-family:'Playfair Display', serif;
    font-size: clamp(2.0rem, 7vw, 2.9rem);
    letter-spacing: 0.06em;
    color: var(--ink);
    transform: translateY(115%);
    animation: riseUp 0.8s cubic-bezier(.2,.8,.2,1) forwards;
  }

  .word.save span{ animation-delay: 1.5s; }
  .word.date span{ animation-delay: 2.05s; }

  @keyframes riseUp{
    to{ transform: translateY(0); }
  }

  .the-script{
    font-family:'Tangerine', cursive;
    font-size: clamp(2.8rem, 9.5vw, 4.4rem);
    color: var(--gold-dark);
    line-height:1;
    display:inline-block;
    opacity:0;
    transform: translateY(10px) rotate(-3deg);
    animation: scriptIn 1s ease-out 1.9s forwards;
    position:relative;
    top: 0.35rem;
  }
  @keyframes scriptIn{
    to{ opacity:1; transform: translateY(0) rotate(-3deg); }
  }

  .subtitle{
    font-family:'Playfair Display', serif;
    font-size: clamp(0.72rem, 1.7vw, 0.85rem);
    letter-spacing:0.28em;
    color: var(--ink-soft);
    font-weight:500;
    margin: 0.6rem 0 0.6rem;
    opacity:0;
    animation: fadeUp 0.9s ease-out 2.6s forwards;
  }

  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .names{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 1rem;
    flex-wrap:wrap;
    margin-bottom: 0.6rem;
  }

  .name{
    font-family:'Playfair Display', serif;
    font-size: clamp(0.95rem, 2.4vw, 1.15rem);
    letter-spacing: 0.14em;
    color: var(--ink);
    opacity:0;
    animation: fadeUp 0.9s ease-out 3.0s forwards;
  }
  .name.bride{ animation-delay: 3.25s; }

  .amp{
    font-family:'Tangerine', cursive;
    font-size: clamp(2.6rem, 7vw, 3.6rem);
    color: var(--oxblood);
    line-height: 0.6;
    opacity:0;
    transform: scale(0.7) rotate(-6deg);
    animation: ampPop 0.7s cubic-bezier(.34,1.56,.64,1) 3.55s forwards;
  }
  @keyframes ampPop{
    to{ opacity:1; transform: scale(1) rotate(-6deg); }
  }

  /* ---- Venue illustration (real artwork, unveiled + given a living glow) ---- */
  .illustration-wrap{
    position:relative;
    display:inline-block;
    margin: 0.1rem auto 0.15rem;
    opacity:0;
    animation: fadeUp 0.8s ease-out 3.9s forwards;
  }

  .halo{
    position:absolute;
    inset: -10%;
    z-index:0;
    background: radial-gradient(circle at 50% 42%, rgba(233,201,106,0.35) 0%, rgba(233,201,106,0.08) 45%, transparent 70%);
    filter: blur(6px);
    opacity:0;
    animation: haloIn 2s ease-out 4.2s forwards, haloPulse 5s ease-in-out 6.2s infinite;
  }
  @keyframes haloIn{ to{ opacity:1; } }
  @keyframes haloPulse{
    0%,100%{ transform: scale(1); opacity:0.75; }
    50%{ transform: scale(1.08); opacity:1; }
  }

  .venue-img{
    position:relative;
    z-index:1;
    display:block;
    width:auto;
    height:auto;
    max-width: min(94vw, 500px);
    max-height: 52vh;
    margin: 0 auto;
    filter: blur(16px) saturate(0.5) brightness(1.1);
    clip-path: circle(4% at 50% 46%);
    animation:
      venueReveal 2.6s cubic-bezier(.22,.9,.3,1) 4.3s forwards,
      venueDevelop 2.2s ease-out 4.3s forwards,
      venueFloat 7s ease-in-out 6.9s infinite;
  }
  @keyframes venueReveal{
    to{ clip-path: circle(75% at 50% 46%); }
  }
  @keyframes venueDevelop{
    to{ filter: blur(0px) saturate(1) brightness(1); }
  }
  @keyframes venueFloat{
    0%,100%{ transform: translateY(0px); }
    50%{ transform: translateY(-7px); }
  }

  .sparkle-pt{
    position:absolute;
    z-index:2;
    width:5px; height:5px;
    background: var(--gold-light);
    border-radius:50%;
    box-shadow: 0 0 6px 2px rgba(233,201,106,0.7);
    opacity:0;
    animation: sparkleTwinkle 3s ease-in-out infinite;
  }
  @keyframes sparkleTwinkle{
    0%,100%{ opacity:0; transform: scale(0.5); }
    50%{ opacity:1; transform: scale(1.2); }
  }
  .sp1{ top:8%;  left:49%; animation-delay: 6.8s; }
  .sp2{ top:22%; left:27%; animation-delay: 7.2s; }
  .sp3{ top:22%; left:71%; animation-delay: 7.6s; }
  .sp4{ top:40%; left:14%; animation-delay: 8.0s; }
  .sp5{ top:40%; left:85%; animation-delay: 8.4s; }

  /* ---- animated venue-name caption, sitting right under the artwork ---- */
  .venue-caption-wrap{
    position:relative;
    z-index:2;
    overflow:hidden;
    white-space:nowrap;
    width:0;
    margin: 0.05rem auto 0;
    animation: captionReveal 1.1s steps(22,end) 6.9s forwards;
  }
  @keyframes captionReveal{ to{ width:100%; } }

  .venue-caption{
    display:inline-block;
    font-family:'Playfair Display', serif;
    font-size: clamp(0.68rem, 1.7vw, 0.8rem);
    letter-spacing: 0.26em;
    color: var(--gold-dark);
    font-weight:600;
    white-space:nowrap;
    padding: 0 0.15rem;
  }

  .venue-caption-rule{
    width:0;
    height:1px;
    margin: 0.2rem auto 0;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    animation: ruleGrow 0.8s ease-out 8.0s forwards;
  }
  @keyframes ruleGrow{ to{ width:55%; } }

  /* ---- Footer details ---- */
  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:0.7rem;
    color: var(--gold);
    margin: 0.45rem 0 0.4rem;
    opacity:0;
    animation: fadeUp 0.8s ease-out 8.3s forwards;
  }
  .divider::before, .divider::after{
    content:"";
    height:1px;
    width:38px;
    background: linear-gradient(90deg, transparent, currentColor);
  }
  .divider::after{ background: linear-gradient(270deg, transparent, currentColor); }
  .divider span{ font-size:0.9rem; transform: translateY(-1px); }

  .date-line{
    font-family:'Playfair Display', serif;
    font-size: clamp(1.3rem, 4.2vw, 1.7rem);
    letter-spacing: 0.04em;
    color: var(--ink);
    margin-bottom: 0.35rem;
    opacity:0;
    animation: fadeUp 0.8s ease-out 8.55s forwards;
  }

  .dari-date{
    font-family:'Noto Naskh Arabic', serif;
    direction: rtl;
    font-size: clamp(0.9rem, 2.6vw, 1.05rem);
    color: var(--ink-soft);
    opacity:0;
    animation: fadeUp 0.8s ease-out 8.8s forwards;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; }
    .card, .word span, .the-script, .subtitle, .name, .amp,
    .illustration-wrap, .halo, .venue-img, .sparkle-pt,
    .venue-caption-wrap, .venue-caption-rule, .divider, .date-line, .dari-date,
    .site-corner{
      opacity:1 !important; transform:none !important; filter:none !important;
    }
    .venue-img{ clip-path:none !important; }
    .eyebrow-wrap, .venue-caption-wrap{ width:100% !important; }
    .venue-caption-rule{ width:55% !important; }
  }
</style>
</head>

<script>
  // ---------- petals / gold dust ----------
  const petalCount = 16;
  for(let i=0;i<petalCount;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    const size = 5 + Math.random()*7;
    p.style.width = size+'px';
    p.style.height = size+'px';
    p.style.left = Math.random()*100+'vw';
    p.style.setProperty('--drift-x', (Math.random()*120-60)+'px');
    p.style.animationDuration = (14 + Math.random()*12)+'s';
    p.style.animationDelay = (Math.random()*14)+'s';
    document.body.appendChild(p);
  }

  // ---------- night sky: twinkling stars + shooting stars ----------
  const canvas = document.getElementById('sky');
  const ctx = canvas.getContext('2d');
  let w, h, stars = [], shootingStars = [];

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function initStars(){
    stars = [];
    const count = Math.floor((w*h)/9000);
    for(let i=0;i<count;i++){
      stars.push({
        x: Math.random()*w,
        y: Math.random()*h*0.75,
        r: Math.random()*1.3 + 0.3,
        phase: Math.random()*Math.PI*2,
        speed: 0.01 + Math.random()*0.02
      });
    }
  }
  initStars();
  window.addEventListener('resize', initStars);

  function spawnShootingStar(){
    const startX = Math.random()*w*0.7 + w*0.15;
    const startY = Math.random()*h*0.25;
    const angle = Math.PI/4 + (Math.random()*0.3-0.15);
    const speed = 9 + Math.random()*5;
    shootingStars.push({
      x:startX, y:startY,
      vx: Math.cos(angle)*speed,
      vy: Math.sin(angle)*speed,
      life: 0,
      maxLife: 40 + Math.random()*20,
      trail: []
    });
  }

  let frame = 0;
  function tick(){
    frame++;
    ctx.clearRect(0,0,w,h);

    // stars
    for(const s of stars){
      s.phase += s.speed;
      const alpha = 0.35 + 0.5*Math.abs(Math.sin(s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
      ctx.fillStyle = `rgba(184,134,63,${alpha*0.7})`;
      ctx.fill();
    }

    // random shooting star trigger
    if(frame % 70 === 0 && Math.random() < 0.8) spawnShootingStar();

    // shooting stars
    shootingStars.forEach(st => {
      st.x += st.vx;
      st.y += st.vy;
      st.life++;
      st.trail.push({x:st.x, y:st.y});
      if(st.trail.length > 14) st.trail.shift();

      for(let i=0;i<st.trail.length-1;i++){
        const t = i/st.trail.length;
        ctx.beginPath();
        ctx.moveTo(st.trail[i].x, st.trail[i].y);
        ctx.lineTo(st.trail[i+1].x, st.trail[i+1].y);
        ctx.strokeStyle = `rgba(233,201,106,${t*0.8})`;
        ctx.lineWidth = t*2.2;
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.arc(st.x, st.y, 1.6, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(255,250,235,0.95)';
      ctx.fill();
    });
    shootingStars = shootingStars.filter(st => st.life < st.maxLife);

    requestAnimationFrame(tick);
  }
  tick();
</script>
